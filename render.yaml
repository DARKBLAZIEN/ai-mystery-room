services:
  - type: web
    name: ai-mystery-room
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DEMO_MODE
        value: "false"
      - key: CASE_GENERATION_MAX_RETRIES
        value: "2"
